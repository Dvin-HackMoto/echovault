[pytest]
# Run from backend/ so the `app` package is importable.
pythonpath = .
testpaths = tests
# No test may reach the network. Loopback stays open because TestClient's event loop
# needs a local socket pair on Windows; 10.255.255.255 is the address main.lan_ip()
# "connects" a UDP socket to at startup, which sends nothing.
addopts = -m "not integration" --allow-hosts=127.0.0.1,::1,10.255.255.255
markers =
    integration: needs a running Ollama server and a downloaded Whisper model
